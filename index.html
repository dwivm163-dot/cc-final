<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past Life Archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="archive-header">
      <h1>Past Life Archive</h1>
      <p class="subhead">Digital Divination Record System</p>
    </header>

    <section class="input-panel">
      <h2>Record Intake</h2>
      <form id="archive-form">
        <label for="userName">Name</label>
        <input id="userName" name="userName" type="text" placeholder="Enter your name" required />

        <label for="birthDate">Birth Date</label>
        <input id="birthDate" name="birthDate" type="date" required />

        <label for="birthTime">Birth Time (Optional)</label>
        <input id="birthTime" name="birthTime" type="time" />

        <label for="birthPlace">Place of Birth (Optional)</label>
        <input id="birthPlace" name="birthPlace" type="text" placeholder="City, Country" />

        <button type="submit" id="retrieveBtn">Retrieve Record</button>
      </form>
    </section>

    <section class="output-panel">
      <h2>Archive Console</h2>
      <div id="statusLog" class="status-log" aria-live="polite"></div>
      <article id="recordOutput" class="record-output hidden" aria-live="polite"></article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
