<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Grey-box] Past Life Archive</title>
  <!-- Same script.js as index.html — wireframe CSS only -->
  <link rel="stylesheet" href="greybox.css" />
</head>
<body>
  <main class="gb-app">
    <p class="gb-banner">Grey-box prototype — same logic as final; aesthetics stripped</p>

    <header class="gb-header archive-header">
      <h1>Past Life Archive</h1>
      <p class="subhead">Digital Divination Record System</p>
    </header>

    <div class="gb-grid">
      <section class="gb-panel page input-panel">
        <h2>Intake Ledger</h2>
        <p class="page-note">Enter your present-life details.</p>
        <form id="archive-form">
          <label for="userName">Name</label>
          <input id="userName" name="userName" type="text" placeholder="Enter your name" required />

          <label for="birthDate">Birth Date</label>
          <input id="birthDate" name="birthDate" type="date" required />

          <label for="birthTime">Birth Time (Optional)</label>
          <input id="birthTime" name="birthTime" type="time" />

          <label for="birthPlace">Place of Birth (Optional)</label>
          <input id="birthPlace" name="birthPlace" type="text" placeholder="City, Country" />

          <button type="submit" id="retrieveBtn">Retrieve Record</button>
        </form>
      </section>

      <section class="gb-panel page output-panel">
        <h2>Archive Page</h2>
        <p class="page-note">Status log + record output (same IDs as final).</p>
        <div id="statusLog" class="status-log" aria-live="polite"></div>
        <article id="recordOutput" class="record-output hidden" aria-live="polite"></article>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
